services:
  backend:
    build:
      context: ./backend
    container_name: swimpulse-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/secrets/firebase-adminsdk.json:/run/secrets/firebase-adminsdk.json:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    container_name: swimpulse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
