services:
  backend:
    build:
      context: ./backend
    container_name: swimpulse-backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    volumes:
      - ./backend/swimpulse-f571e-firebase-adminsdk-fbsvc-f36e419e99.json:/run/secrets/firebase-adminsdk.json:ro
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: swimpulse-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.7.2
    container_name: swimpulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:12.1.1
    container_name: swimpulse-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: swimpulse-admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:0.49.0
    container_name: swimpulse-k6
    profiles: ["loadtest"]
    working_dir: /scripts
    volumes:
      - ./ops/k6/scripts:/scripts:ro
      - ./ops/k6/results:/results
    environment:
      BASE_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
