services:
  backend:
    build:
      context: ./backend
    container_name: swimpulse-backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    volumes:
      - ./backend/swimpulse-f571e-firebase-adminsdk-fbsvc-f36e419e99.json:/run/secrets/firebase-adminsdk.json:ro
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: swimpulse-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
