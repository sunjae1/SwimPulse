spring.datasource.url=jdbc:h2:mem:swimpulse;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.data.redis.repositories.enabled=false
spring.task.scheduling.enabled=false
swimpulse.notification.worker-delay-ms=60000
swimpulse.event.scheduler-delay-ms=60000
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:3000/login/oauth2/code/google
swimpulse.auth.jwt-secret=swimpulse-test-jwt-secret-change-me-1234567890
swimpulse.auth.jwt-expiration-hours=168
swimpulse.auth.cookie-secure=false
swimpulse.auth.success-redirect-uri=http://localhost:3000?login=success
