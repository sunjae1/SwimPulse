spring.application.name=SwimPulse
server.port=${SERVER_PORT:8080}
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.swimpulse=${SWIMPULSE_APP_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SWIMPULSE_SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=${SWIMPULSE_SQL_BIND_LOG_LEVEL:OFF}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Seoul} %-5level [%thread] requestId=%X{requestId:-} userId=%X{userId:-} %logger{36} - %msg%n

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/swimpulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:swimpulse}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:swimpulse}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}
spring.flyway.baseline-description=Existing schema before Flyway
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${SWIMPULSE_OAUTH2_REDIRECT_URI:http://localhost:3000/login/oauth2/code/google}

swimpulse.notification.queue-key=${SWIMPULSE_NOTIFICATION_QUEUE_KEY:swimpulse:notifications}
swimpulse.notification.reminder-minutes=${SWIMPULSE_NOTIFICATION_REMINDER_MINUTES:10}
swimpulse.notification.max-attempts=${SWIMPULSE_NOTIFICATION_MAX_ATTEMPTS:3}
swimpulse.notification.worker-delay-ms=${SWIMPULSE_NOTIFICATION_WORKER_DELAY_MS:1000}
swimpulse.notification.worker-batch-size=${SWIMPULSE_NOTIFICATION_WORKER_BATCH_SIZE:20}
swimpulse.event.scheduler-delay-ms=${SWIMPULSE_EVENT_SCHEDULER_DELAY_MS:30000}
swimpulse.event.scheduler-lock-key=${SWIMPULSE_EVENT_SCHEDULER_LOCK_KEY:swimpulse:locks:event-scheduler}
swimpulse.event.scheduler-lock-ttl-ms=${SWIMPULSE_EVENT_SCHEDULER_LOCK_TTL_MS:25000}
swimpulse.firebase.service-account-path=${SWIMPULSE_FIREBASE_SERVICE_ACCOUNT_PATH:}
swimpulse.auth.jwt-secret=${SWIMPULSE_JWT_SECRET:swimpulse-local-dev-jwt-secret-change-me-1234567890}
swimpulse.auth.jwt-expiration-hours=${SWIMPULSE_JWT_EXPIRATION_HOURS:168}
swimpulse.auth.cookie-secure=${SWIMPULSE_AUTH_COOKIE_SECURE:false}
swimpulse.auth.success-redirect-uri=${SWIMPULSE_AUTH_SUCCESS_REDIRECT_URI:http://localhost:3000}
swimpulse.naver.maps.client-id=${NAVER_MAPS_CLIENT_ID:}
swimpulse.naver.maps.client-secret=${NAVER_MAPS_CLIENT_SECRET:}
swimpulse.naver.search.client-id=${NAVER_SEARCH_CLIENT_ID:}
swimpulse.naver.search.client-secret=${NAVER_SEARCH_CLIENT_SECRET:}
swimpulse.openai.api-key=${OPENAI_API_KEY:}
swimpulse.openai.model=${SWIMPULSE_OPENAI_MODEL:gpt-5.4-mini}
swimpulse.notice.insecure-ssl-fallback=${SWIMPULSE_NOTICE_INSECURE_SSL_FALLBACK:false}
swimpulse.notice.scan-lock-key-prefix=${SWIMPULSE_NOTICE_SCAN_LOCK_KEY_PREFIX:swimpulse:locks:notice-scan:}
swimpulse.notice.scan-lock-ttl-ms=${SWIMPULSE_NOTICE_SCAN_LOCK_TTL_MS:300000}
